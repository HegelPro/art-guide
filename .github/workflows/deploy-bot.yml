name: Deploy bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: bot-production
  cancel-in-progress: false

jobs:
  build:
    name: Build bot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix bot

      - name: Build TypeScript
        run: npm --prefix bot run build

      - name: Build Docker image
        run: docker build -t art-guide-bot:ci ./bot

  deploy:
    name: Deploy bot
    runs-on: ubuntu-latest
    needs: build

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      SSH_USER: ${{ secrets.SSH_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Rebuild bot on server
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "set -e
             cd \"$DEPLOY_PATH\"
             git fetch origin main
             git reset --hard origin/main
             docker compose -f bot/docker-compose.yaml up -d --build --force-recreate --remove-orphans"
